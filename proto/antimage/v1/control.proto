syntax = "proto3";

package antimage.v1;

option go_package = "github.com/amyrm/antimage/internal/shared/proto/antimage/v1;antimagev1";

// Enrollment runs once per node, over TLS validated against the CA
// fingerprint pinned in node.yaml. Every later call uses mTLS.
service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  // Single-use, 30 minute TTL, bound to one node.
  string token = 1;
  // The node's CSR. Its private key never leaves the host, and the panel
  // never sees it.
  bytes csr_der = 2;
  string agent_version = 3;
  uint32 protocol_version = 4;
}

message EnrollResponse {
  // Signed client certificate, CN = node id. The panel names the node; the
  // CSR's own subject is ignored so a node cannot name itself.
  bytes cert_der = 1;
  // Panel CA, for verifying the panel on later connections.
  bytes ca_der = 2;
  int64 node_id = 3;
}

service Control {
  // Stream is dialed by the agent and held open. The panel never dials the
  // node, so nodes need no inbound port.
  rpc Stream(stream AgentMessage) returns (stream PanelMessage);

  // GetDesiredSnapshot returns the exact canonical bytes that were hashed.
  rpc GetDesiredSnapshot(SnapshotRequest) returns (SnapshotResponse);
}

message AgentMessage {
  oneof payload {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    ApplyReport apply_report = 3;
    UsageReport usage_report = 4;
    AgentCommandResult command_result = 5;
  }
}

message PanelMessage {
  oneof payload {
    RevisionBump revision_bump = 1;
    FetchNow fetch_now = 2;
    UpgradeRequired upgrade_required = 3;
    AgentCommand command = 4;
  }
}

// AgentCommand is the panel asking the agent to do something ON DEMAND,
// outside the desired-state reconciliation loop -- restarting a service the
// operator clicked, or (later) pulling a fresh geo database, reporting an
// installed core version precisely, or opening a log tail. It exists
// separately from RevisionBump/FetchNow because those two both mean
// "converge toward the desired document", and an on-demand action is not a
// convergence request: a restart with no config change has nothing to
// converge, and this command is what asks for it anyway.
//
// command_id correlates this to its AgentCommandResult. It is a string
// rather than reusing the desired_revision or any DB primary key, because a
// command is not a row anywhere -- the panel's Hub only needs to remember it
// long enough to wake whichever HTTP request is waiting, and does not
// persist it. A UUID generated per HTTP request satisfies that with no
// coordination against any other id space.
message AgentCommand {
  string command_id = 1;
  oneof body {
    RestartAdapters restart_adapters = 2;
    UpdateGeoData update_geo_data = 3;
  }
}

// RestartAdapters names which adapter kinds to restart. Empty means every
// adapter this node currently runs -- explicit rather than a sentinel value,
// so a caller who really does mean "just xray" is not one typo away from
// restarting everything.
message RestartAdapters {
  repeated string kinds = 1;
}

// UpdateGeoData asks the agent to fetch fresh geoip/geosite databases and
// restart whichever adapter uses them. The panel supplies the URLs rather
// than the agent hardcoding an upstream: an operator behind a mirror or
// firewall can point at their own copy without an agent upgrade, and there
// is exactly one place -- the panel -- that decides which source a fleet
// trusts.
//
// Xray reads geo data once at process start, not on SIGHUP/reload, so
// "update" without a restart would download a file nothing reads; the
// agent restarts the adapter itself once the new files verify, using the
// same Adapter.Restart path RestartAdapters uses.
message UpdateGeoData {
  string geoip_url = 1;
  string geoip_sha256_url = 2;
  string geosite_url = 3;
  string geosite_sha256_url = 4;
}

message AgentCommandResult {
  string command_id = 1;
  oneof body {
    RestartAdaptersResult restart_adapters = 2;
    UpdateGeoDataResult update_geo_data = 3;
  }
}

message UpdateGeoDataResult {
  repeated AdapterGeoUpdateOutcome outcomes = 1;
}

// AdapterGeoUpdateOutcome is per adapter kind, so a node running xray
// alongside wireguard reports xray's real outcome without wireguard's
// unrelated presence changing anything about it.
//
// Unlike AdapterRestartOutcome, adapters with no geo-database concept at
// all do NOT get a row here -- most of the protocols this codebase drives
// have no domain/IP category routing, and listing five "unsupported" rows
// for a node that only runs xray would be noise, not signal. An empty
// outcomes list means no adapter on this node has geo data to update at
// all, which the caller reports as its own clear condition rather than as
// a silent no-op success.
message AdapterGeoUpdateOutcome {
  string kind = 1;
  bool ok = 2;
  string geoip_sha256 = 3;
  string geosite_sha256 = 4;
  // Empty when ok.
  string error = 5;
}

message RestartAdaptersResult {
  repeated AdapterRestartOutcome outcomes = 1;
}

// AdapterRestartOutcome is per adapter kind, because a node running xray and
// wireguard together can have one restart and the other refuse -- wireguard
// has no restartable daemon in the systemd sense, and reporting that
// truthfully as unsupported is the whole point of doing this per-kind rather
// than collapsing to one ok/error for the node.
message AdapterRestartOutcome {
  string kind = 1;
  bool ok = 2;
  // Empty when ok. "unsupported: <reason>" when the adapter kind has no
  // restart concept, never silently ok.
  string error = 3;
}

message Hello {
  int64 node_id = 1;
  string agent_version = 2;
  uint32 protocol_version = 3;
  int64 applied_revision = 4;
  string doc_sha256 = 5;
  repeated AdapterDescriptor adapters = 6;
}

message AdapterDescriptor {
  string kind = 1;
  string version = 2;
  bool hot_user_add = 3;
  bool self_accounting = 4;
  bool requires_pki = 5;
  // JSON Schema for this adapter's service params. The panel validates
  // writes against it and the UI renders forms from it.
  bytes service_schema = 6;
  repeated string capabilities = 7;  // SP5: adapter capabilities (e.g., ["tls", "ws", "grpc"])
}

message Heartbeat {
  double load1 = 1;
  uint64 mem_used_bytes = 2;
  uint64 uptime_seconds = 3;
  repeated AdapterHealth adapter_health = 4;
}

message AdapterHealth {
  string kind = 1;
  bool ok = 2;
  string detail = 3;
}

message ApplyReport {
  int64 target_revision = 1;
  bool converged = 2;
  bool deferred = 3;
  string error = 4;
  // The hash the agent actually applied. The panel compares this against the
  // hash it recorded for target_revision; a match on revision with a mismatch
  // here is an integrity fault, never convergence.
  string doc_sha256 = 5;
  repeated StepResult steps = 6;
}

message StepResult {
  int32 seq = 1;
  string kind = 2;
  // "none" | "reload" | "restart"
  string disruption = 3;
  bool ok = 4;
  string error = 5;
  int64 duration_ms = 6;
}

message RevisionBump {
  int64 revision = 1;
}

message FetchNow {}

message UpgradeRequired {
  uint32 panel_protocol_version = 1;
  string download_url = 2;
}

message SnapshotRequest {
  int64 node_id = 1;
}

message SnapshotResponse {
  int64 revision = 1;
  // Exact canonical bytes. The agent re-hashes these before applying, so this
  // must stay `bytes` rather than a structured message that could re-encode.
  bytes document = 2;
  string sha256 = 3;
}

// UsageReport carries accounting deltas from one node. SP3 design decision 1:
// the agent computes deltas; the panel never reasons about raw counters.
message UsageReport {
  int64 node_id = 1;
  // Monotonic per node. Idempotency key: (node_id, sequence).
  int64 sequence = 2;
  repeated UsageSample samples = 3;
}

// UsageSample is one subject's traffic delta on one service since the last
// report.
message UsageSample {
  int64 subject_id = 1;
  uint64 uplink_bytes = 2;
  uint64 downlink_bytes = 3;
  // Which service the traffic went through, when the adapter can attribute it
  // (C2). Zero means "not attributed", which the panel stores as NULL rather
  // than guessing: a node running one adapter that cannot attribute, or an
  // agent older than this field, both send zero and must keep accounting.
  //
  // Deliberately not optional. Proto3 scalar presence would distinguish "the
  // agent said zero" from "the agent said nothing", and there is nothing the
  // panel would do differently: both mean the same NULL.
  int64 service_id = 4;
}
