global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'antimage-panel'
    static_configs:
      - targets: ['panel:8080']
    metrics_path: '/metrics'

  - job_name: 'antimage-nodes'
    static_configs:
      - targets: ['node:50051']
    metrics_path: '/metrics'
