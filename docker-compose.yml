version: '3.8'

services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: antimage-panel:latest
    container_name: antimage-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./config:/config
    environment:
      - ANTIMAGE_DB_PATH=/data/antimage.db
      - ANTIMAGE_LISTEN=0.0.0.0:8080
      - ANTIMAGE_LOG_LEVEL=info
      - ANTIMAGE_SECRET_KEY_FILE=/config/secret.key
    command: >
      /usr/local/bin/antimage-panel
      --db /data/antimage.db
      --listen 0.0.0.0:8080
      --secret-key-file /config/secret.key
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  node:
    build:
      context: .
      dockerfile: Dockerfile
    image: antimage-node:latest
    container_name: antimage-node
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./node-data:/data
      - ./node-config:/config
      - /dev/net/tun:/dev/net/tun
    environment:
      - ANTIMAGE_NODE_ID=1
      - ANTIMAGE_PANEL_URL=https://panel.example.com
      - ANTIMAGE_DATA_DIR=/data
    command: >
      /usr/local/bin/antimage-node
      --data-dir /data
      --panel-url https://panel.example.com
      --cert /config/node.crt
      --key /config/node.key
    depends_on:
      - panel

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: antimage-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: antimage-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
